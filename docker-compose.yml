version: "3.8"

services:
  tip:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change-me}
      - DB_PATH=/app/data/tip.db
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    volumes:
      - tip-data:/app/data
    restart: unless-stopped

volumes:
  tip-data:
